# Place the real configuration and tunnel credential outside this repository.
tunnel: YOUR-TUNNEL-UUID
credentials-file: C:\Users\YOUR-USER\.cloudflared\YOUR-TUNNEL-UUID.json
ingress:
  - hostname: fund.example.com
    service: http://127.0.0.1:8766
    originRequest:
      access:
        required: true
        teamName: YOUR-CLOUDFLARE-TEAM
        audTag:
          - YOUR-ACCESS-APPLICATION-AUDIENCE
  - service: http_status:404
